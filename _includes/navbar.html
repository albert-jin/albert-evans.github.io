<nav class="navbar navbar-expand-sm navbar-dark bg-dark fixed-top mb-5 shadow-sm">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <a class="navbar-brand"><strong>{{site.data.profile.navbar_name}}</strong></a>
        <select id="lang-switcher" class="form-control form-control-sm nav-lang-select nav-lang-select-left" onchange="triggerExternalTranslate(this.value)" title="Translate language">
            <option value="">Lang</option>
            <option value="en">EN</option>
            <option value="zh-CN">ZH</option>
            <option value="ja">JA</option>
            <option value="ko">KO</option>
            <option value="de">DE</option>
            <option value="fr">FR</option>
        </select>
        <button type="button" class="side-rain-secret-trigger" aria-label="Cycle sidebar background"></button>

        <button class="navbar-toggler" style="font-size: 1em; padding: 0.5em;" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-map"></i> Menu
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title %}active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}">{{ item.name }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>
<script>
function triggerExternalTranslate(langCode) {
    if (!langCode) return;
    var currentUrl = window.location.href;
    var translateUrl = "https://translate.google.com/translate?sl=auto&tl=" + encodeURIComponent(langCode) + "&u=" + encodeURIComponent(currentUrl);
    window.location.href = translateUrl;
}
</script>
