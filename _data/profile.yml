short_bio_text_justify: false
short_bio: >-
  <p>
    Greetings! I am Weiqiang Jin (Albert Jin), Ph.D. candidate at Xi'an Jiaotong University (since 2022-09). Research focus:
    LLM reasoning and tuning, natural language processing, multi-agent reinforcement learning, intelligent retrieval,
    and data-centric AI applications. At this stage, my core research emphasis is on medical foundation models, AIVC virtual cells,
    and TTS optimization for large-model MoE routing as well as LLM-TTS inference.
  </p>
  <p>
    He was a visiting research assistant at The University of Hong Kong from February to September 2025
    and then served as an Honorary Research Assistant at The Chinese University of Hong Kong from September 2025 to February 2026,
    under the supervision of Professor Irwin King.
  </p>
  <p>
    He is currently a research intern at Huawei's Foundational LLM Department in Shenzhen (Foundational LLM Team),
    where he focuses on practical LLM system development, model reasoning/tuning workflows, and industry-oriented deployment.
  </p>
  <p>
    He plans to pursue a 2-3 year postdoctoral position at Imperial College London in the future.
    If <span data-toggle="tooltip" data-placement="top" title="&#x4E2D;&#x6587;&#x63D0;&#x793A;&#xFF1A;&#x5982;&#x679C;&#x60A8;&#x672C;&#x4EBA;&#x3001;&#x6216;&#x60A8;&#x6240;&#x5728;&#x7684;&#x5927;&#x5B66;&#x6216;&#x7814;&#x7A76;&#x673A;&#x6784;&#x613F;&#x610F;&#x63D0;&#x4F9B;&#x652F;&#x6301;&#xFF0C;&#x6B22;&#x8FCE;&#x4E0E;&#x6211;&#x8054;&#x7CFB;&#x3002;">you, your university, or your research institution</span>
    are willing to support his application for <strong><a target="_blank" href="https://www.nsfc.gov.cn/p1/3381/2824/121517.html">Overseas Outstanding Young Scientist programs</a></strong>,
    please contact: <a href="mailto:weiqiangjin@stu.xjtu.edu.cn">weiqiangjin@stu.xjtu.edu.cn</a>.
  </p>
