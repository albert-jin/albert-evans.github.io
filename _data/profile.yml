short_bio: >-
  <p>
    Greetings! I am <strong>Weiqiang Jin (Albert Jin)</strong>, Ph.D. candidate at <a href="https://eie.xjtu.edu.cn/">Faculty of Electronic and Information Engineering</a> of <a href="https://www.xjtu.edu.cn/xynr.jsp?wbtreeid=1634&wbxjtucollegeid=207">Xi'an Jiaotong University</a> (since 2022-09). Research focus:
    LLM reasoning and tuning, natural language processing, multi-agent reinforcement learning, intelligent retrieval,
    and data-centric AI applications. At this stage, my core research emphasis is on medical foundation models, AIVC virtual cells,
      and TTS optimization for large-model MoE routing as well as LLM-TTS inference.
  </p>
  <p>
    I was a visiting research assistant at <a href="https://hongyangdu.github.io/">NICE lab</a> of <a href="https://www.hku.hk/">The University of Hong Kong</a> from February to September 2025
    and then served as an Honorary Research Assistant at <a href="https://www.cuhk.edu.hk/english/index.html">The Chinese University of Hong Kong</a> from September 2025 to February 2026,
      under the supervision of <a href="https://www.cse.cuhk.edu.hk/irwin.king/">Professor Irwin King</a>. I'm currently a research intern at Huawei's <a href="https://www.sohu.com/a/964143772_661663">Foundational LLM Department</a> in Shenzhen,
      where I focus on practical LLM system development, model reasoning/tuning workflows, and industry-oriented deployment.
  </p>
  <!--<a href=""></a>-->
  <p>
    I plan to pursue a 2-3 year postdoctoral position at <a href="https://www.imperial.ac.uk/">Imperial College London</a> in the future.
    If You, Your university, or Your research institution</span>
    are willing to support his application for <strong><a target="_blank" href="https://www.nsfc.gov.cn/p1/3381/2824/121517.html">Overseas Outstanding Young Scientist programs</a></strong>,
    please contact: <a href="mailto:weiqiangjin@stu.xjtu.edu.cn">weiqiangjin@stu.xjtu.edu.cn</a>.
  </p>
